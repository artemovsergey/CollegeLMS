# dsh-collegelms — конфигурационный bundle для профиля DSH desktop.
#
# Слой ставится после @deepseek-ai/dsh-base и @deepseek-ai/dsh-web-app:
#   * разрешает субагентам выбирать модели opencode-go (нужно для ролей
#     Backend / Frontend / Tester / DevOps / Docs);
#   * подключает MCP-серверы github, context7, ms_learn, playwright.
#
# Секретов в файле нет. GitHub-токен читает scripts/dsh/github-mcp.cmd
# через `gh auth token` и передаёт серверу только в переменной окружения.

- id: subagent-model-selection-settings
  name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
  config:
    enabled: true
    allowedModels:
      - provider: opencode-go
        model: deepseek-v4.1-flash
      - provider: opencode-go
        model: kimi-k2.7-code
      - provider: opencode-go
        model: kimi-k3
      - provider: opencode-go
        model: glm-5.3-flash
      - provider: opencode-go
        model: gpt-6-luna
      - provider: opencode-go
        model: qwen3.8-flash

- insert:
    # GitHub: issues, PR, Actions, код и релизы. Токен — из `gh auth token`.
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: stdio
        command: cmd.exe
        args:
          - /d
          - /c
          - C:/Users/asv/Desktop/CollegeLMS/scripts/dsh/github-mcp.cmd
        failOnStartupError: false
        toolCallTimeoutMs: 120000

    # Context7: актуальная документация библиотек (Next.js, EF Core, Playwright…).
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
        failOnStartupError: false
        toolCallTimeoutMs: 60000

    # Microsoft Learn: официальные материалы по .NET / ASP.NET Core / EF Core.
    - id: mcp-ms-learn
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ms_learn
        transport: streamable-http
        url: https://learn.microsoft.com/api/mcp
        failOnStartupError: false
        toolCallTimeoutMs: 60000

    # Playwright: браузер, проверка UI и E2E-сценариев стенда.
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: C:/Program Files/nodejs/node.exe
        args:
          - C:/Users/asv/AppData/Roaming/npm/node_modules/@playwright/mcp/cli.js
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        failOnStartupError: false
        toolCallTimeoutMs: 180000
