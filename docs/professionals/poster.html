<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Постер — отбор на чемпионат «Профессионалы»</title>
<style>
  /* Фирменный шрифт чемпионата — Roboto (в комплекте брендбука) */
  @font-face { font-family:'Roboto'; src:url('assets/fonts/Roboto-Black.ttf') format('truetype'); font-weight:900; font-style:normal; font-display:block; }
  @font-face { font-family:'Roboto'; src:url('assets/fonts/Roboto-Bold.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:block; }
  @font-face { font-family:'Roboto'; src:url('assets/fonts/Roboto-Medium.ttf') format('truetype'); font-weight:500; font-style:normal; font-display:block; }
  @font-face { font-family:'Roboto'; src:url('assets/fonts/Roboto-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:block; }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:540px; height:675px; }

  body {
    background:#1D1D1B; /* фирменный чёрный */
    font-family:'Roboto', system-ui, Arial, sans-serif;
    color:#fff;
    position:relative;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
  }

  /* --- Декор: шевроны и паттерн кубов --- */
  .decor { position:absolute; pointer-events:none; z-index:0; }
  .decor--chevrons-r { right:-92px; top:150px; height:360px; opacity:.08; }
  .decor--chevrons-l { left:-70px; bottom:30px; height:200px; opacity:.07; transform:scaleX(-1); }
  .decor--cubes { left:-30px; bottom:-40px; width:300px; opacity:.07; }

  /* --- Сетка постера --- */
  .page {
    position:relative; z-index:1;
    height:100%;
    display:flex; flex-direction:column;
    padding:24px 30px 0;
  }

  header { display:flex; justify-content:space-between; align-items:flex-start; }
  .logo-prof { height:42px; display:block; }
  .hashtag {
    color:#4ECC0A;
    font-weight:900; font-size:9px; letter-spacing:.07em;
    line-height:1.4; text-align:right; max-width:210px;
    padding-top:4px;
  }

  /* зелёная линия — фирменный акцент под шапкой */
  .brand-bar { position:absolute; z-index:1; left:0; right:0; top:74px; height:3px; background:#4ECC0A; }

  /* --- Заголовок с эмблемой колледжа (SVG, без подложки) --- */
  .title-row { margin-top:32px; display:flex; align-items:center; gap:14px; }
  h1 {
    font-weight:900; font-size:46px; line-height:.98; letter-spacing:-.015em;
  }
  h1 .accent { color:#4ECC0A; }
  .title-row .emblem { height:148px; width:auto; display:block; flex:none; }

  .sub {
    margin-top:14px;
    color:#BDC6CB; font-weight:500; font-size:13px; line-height:1.35;
  }

  /* --- Единая подпись для всех QR --- */
  .hint { margin-top:20px; text-align:center; color:#BDC6CB; font-weight:500; font-size:11px; }
  .hint b { color:#4ECC0A; font-weight:900; letter-spacing:.01em; }

  /* --- Карточки компетенций --- */
  .cards { margin-top:20px; display:flex; gap:11px; }
  .card {
    position:relative; flex:1 1 0; min-width:0;
    background:#fff; color:#1D1D1B;
    border-radius:14px; padding:15px 9px 15px;
  }
  .card h3 {
    font-weight:700; font-size:11px; line-height:1.22; letter-spacing:-.01em;
    min-height:41px;
  }
  .card h3 .dot {
    display:inline-block; width:7px; height:7px; border-radius:2px;
    background:#4ECC0A; margin-right:5px; vertical-align:1px;
  }
  .card .qr { width:100%; height:auto; display:block; margin-top:10px; border-radius:4px; }

  /* --- Контакты: компактная строка, прижата к низу --- */
  .contact { margin-top:auto; padding-bottom:26px; text-align:center; color:#BDC6CB; font-weight:500; font-size:11px; }
  .contact b { color:#fff; font-weight:700; }
</style>
</head>
<body>
  <img class="decor decor--chevrons-r" src="assets/chevrons.svg" alt="">
  <img class="decor decor--chevrons-l" src="assets/chevrons.svg" alt="">
  <img class="decor decor--cubes" src="assets/pattern-cubes.png" alt="">
  <div class="brand-bar"></div>

  <div class="page">
    <header>
      <img class="logo-prof" src="assets/professionals-logo-white.png" alt="Чемпионат «Профессионалы»">
      <div class="hashtag">#ПРОФЕССИОНАЛЫ<br>СДЕЛАНОВРОССИИ</div>
    </header>

    <div class="title-row">
      <h1>Хочешь на&nbsp;чемпионат?<br><span class="accent">Покажи себя!</span></h1>
      <img class="emblem" src="assets/college-emblem.svg" alt="Ставропольский колледж связи им. В.А. Петрова">
    </div>
    <p class="sub">Отбор студентов на Всероссийский чемпионат «Профессионалы»</p>

    <div class="hint"><b>Сканируй QR</b> — откроется тестовое задание твоей компетенции</div>

    <div class="cards">
      <div class="card">
        <h3><span class="dot"></span>Программные решения для бизнеса</h3>
        <img class="qr" src="qr/qr-programmnye-resheniya.png" alt="QR: тестовое задание — Программные решения для бизнеса">
      </div>
      <div class="card">
        <h3><span class="dot"></span>Веб-технологии</h3>
        <img class="qr" src="qr/qr-veb-tehnologii.png" alt="QR: тестовое задание — Веб-технологии">
      </div>
      <div class="card">
        <h3><span class="dot"></span>Разработка мобильных приложений</h3>
        <img class="qr" src="qr/qr-mobilnye-prilozheniya.png" alt="QR: тестовое задание — Разработка мобильных приложений">
      </div>
    </div>

    <div class="contact">Запись и вопросы — <b>кабинет 202л</b></div>
  </div>
</body>
</html>
