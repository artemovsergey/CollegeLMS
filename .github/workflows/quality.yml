name: Quality

on:
  workflow_call:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CollegeLMS.slnx

      - name: Build
        run: dotnet build CollegeLMS.slnx --no-restore

      - name: Test
        run: dotnet test CollegeLMS.slnx --no-build

      - name: CSharpier check
        run: |
          dotnet tool restore
          dotnet csharpier check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CollegeLMS.Next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CollegeLMS.Next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Гейты дизайн-системы проверяют токены, контраст и согласованность
      # разметки. Без них в PR проходила регрессия палитры, битый контраст в
      # тёмной теме и появление второго рецепта фокуса — всё, что §7 называет
      # обязательно общим для четырёх поверхностей.
      - name: Design system gate
        run: npm run check:design-system

      - name: Design system contrast report
        run: npm run check:design-system:report

      - name: Build
        run: npm run build
