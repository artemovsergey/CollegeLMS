name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
  JWT_KEY: ${{ secrets.JWT_KEY }}
  MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
  CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PASSWORD,TELEGRAM_BOT_TOKEN,TELEGRAM_ALLOWED_USER_ID,JWT_KEY,MAX_BOT_TOKEN,CERTBOT_EMAIL
          command_timeout: 30m
          script: |
            set -e
            cd /home/user1/CollegeLMS

            echo "=== Free disk space (before cleanup) ==="
            df -h /

            echo "=== Aggressive cleanup before build ==="
            docker image prune -af || true
            docker volume prune -f || true
            docker network prune -f || true
            docker builder prune -af --filter "until=48h" || true

            echo "=== Disk after cleanup ==="
            df -h /

            echo "=== Store current commit for rollback ==="
            PREVIOUS_COMMIT=$(git rev-parse HEAD)

            echo "=== git pull ==="
            git fetch origin master
            git reset --hard origin/master

            echo "=== .env from secrets ==="
            {
              echo "DB_PORT=5432"
              echo "DB_USER=postgres"
              echo "DB_PASSWORD=${DB_PASSWORD}"
              echo "DB_NAME=collegelms"
              echo "REDIS_PORT=6379"
              echo "API_PORT=5026"
              echo "ASPNETCORE_ENVIRONMENT=Production"
              echo "NGINX_HTTP_PORT=80"
              echo "NGINX_HTTPS_PORT=443"
              echo "PUBLIC_DOMAIN=stvcc.tech"
              echo "CERTBOT_EMAIL=${CERTBOT_EMAIL}"
              echo "TELEGRAM_BOT_PORT=5030"
              echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
              echo "TELEGRAM_ALLOWED_USER_ID=${TELEGRAM_ALLOWED_USER_ID}"
              echo "JWT_KEY=${JWT_KEY}"
              echo "MAX_BOT_TOKEN=${MAX_BOT_TOKEN}"
              echo "OPENCODE_SERVER_URL=http://host.docker.internal:4096"
              echo "OPENCODE_USERNAME=opencode"
              echo "OPENCODE_PASSWORD="
              echo "OPENCODE_DEFAULT_MODEL=opencode/deepseek-v4-flash-free"
            } > .env

            echo "=== Stop old containers ==="
            docker compose --profile telegram-bot --profile max-bot down --remove-orphans || true

            echo "=== Build & start all services ==="
            docker compose --profile telegram-bot --profile max-bot up --build -d --force-recreate

            echo "=== Issue Let's Encrypt certificate if needed ==="
            if ! docker exec collegelms-certbot test -f /etc/letsencrypt/.stvcc-tech-issued; then
              if [ -z "${CERTBOT_EMAIL}" ]; then
                echo "CERTBOT_EMAIL secret is required for the first certificate issuance."
                exit 1
              fi
              docker compose run --rm --entrypoint certbot certbot certonly \
                --webroot \
                --webroot-path /var/www/certbot \
                --email "${CERTBOT_EMAIL}" \
                --agree-tos \
                --no-eff-email \
                --non-interactive \
                --force-renewal \
                -d stvcc.tech
              docker exec collegelms-certbot touch /etc/letsencrypt/.stvcc-tech-issued
              docker compose restart loadbalancer
            fi

            echo "=== Health check (retry up to 60s) ==="
            API_HEALTH="000"
            for i in $(seq 1 12); do
              sleep 5
              API_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5026/healthz || echo "000")
              if [ "$API_HEALTH" = "200" ]; then
                echo "API health check PASSED (attempt $i)"
                break
              fi
              echo "API health check attempt $i: HTTP $API_HEALTH"
            done
            if [ "$API_HEALTH" != "200" ]; then
              echo "API health check FAILED after 12 attempts. Starting rollback..."
              git reset --hard "$PREVIOUS_COMMIT"
              docker compose --profile telegram-bot --profile max-bot up --build -d --force-recreate
              echo "Rollback complete."
              exit 1
            fi

            curl -s http://localhost:5030/health || echo "Warning: Telegram bot not responding"

            echo "=== MaxBot verification ==="
            sleep 20
            MAXBOT_ID=$(docker ps -q -f name=collegelms-maxbot -f status=running)
            echo "MaxBot container id: ${MAXBOT_ID:-missing}"
            if [ -z "$MAXBOT_ID" ]; then
              echo "MaxBot is not running. Logs:"
              docker compose logs maxbot --tail 100 || true
              exit 1
            fi
            docker compose logs --since 20s maxbot 2>&1 | grep -q "Fetching updates" && echo "MaxBot polling MAX API: OK" || echo "Warning: polling logs not found yet"

            echo "=== Final cleanup ==="
            docker image prune -af || true
