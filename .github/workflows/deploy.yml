name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  JWT_KEY: ${{ secrets.JWT_KEY }}
  MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
  MAX_BOT_WEBHOOK_SECRET: ${{ secrets.MAX_BOT_WEBHOOK_SECRET }}
  MAXBOT_INTERNAL_SECRET: ${{ secrets.MAXBOT_INTERNAL_SECRET }}
  MAX_BOT_PUBLIC_NAME: ${{ secrets.MAX_BOT_PUBLIC_NAME }}
  CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PASSWORD,JWT_KEY,MAX_BOT_TOKEN,CERTBOT_EMAIL,MAX_BOT_WEBHOOK_SECRET,MAXBOT_INTERNAL_SECRET,MAX_BOT_PUBLIC_NAME
          command_timeout: 30m
          script: |
            set -e
            cd /home/user1/CollegeLMS

            echo "=== Free disk space (before cleanup) ==="
            df -h /

            echo "=== Aggressive cleanup before build ==="
            docker image prune -af || true
            docker volume prune -f || true
            docker network prune -f || true
            docker builder prune -af --filter "until=48h" || true

            echo "=== Disk after cleanup ==="
            df -h /

            echo "=== Store current commit for rollback ==="
            PREVIOUS_COMMIT=$(git rev-parse HEAD)

            echo "=== git pull ==="
            git fetch origin master
            git reset --hard origin/master

            echo "=== .env from secrets ==="
            {
              echo "DB_PORT=5432"
              echo "DB_USER=postgres"
              echo "DB_PASSWORD=${DB_PASSWORD}"
              echo "DB_NAME=collegelms"
              echo "REDIS_PORT=6379"
              echo "API_PORT=5026"
              echo "ASPNETCORE_ENVIRONMENT=Production"
              echo "NGINX_HTTP_PORT=80"
              echo "NGINX_HTTPS_PORT=443"
              echo "CERTBOT_EMAIL=${CERTBOT_EMAIL}"
              echo "JWT_KEY=${JWT_KEY}"
              echo "MAX_BOT_TOKEN=${MAX_BOT_TOKEN}"
              echo "MAX_BOT_WEBHOOK_URL=https://stvcc.tech/maxbot/webhook"
              echo "MAX_BOT_WEBHOOK_SECRET=${MAX_BOT_WEBHOOK_SECRET}"
              echo "MAXBOT_INTERNAL_SECRET=${MAXBOT_INTERNAL_SECRET}"
              echo "MAX_BOT_PUBLIC_NAME=${MAX_BOT_PUBLIC_NAME}"
            } > .env

            if [ -z "${MAX_BOT_TOKEN}" ]; then
              echo "MAX_BOT_TOKEN secret пуст — бот не сможет подключиться к MAX API."
              echo "Задайте секрет MAX_BOT_TOKEN в GitHub Actions и повторите деплой."
              exit 1
            fi

            if [ -z "${MAX_BOT_WEBHOOK_SECRET}" ]; then
              echo "MAX_BOT_WEBHOOK_SECRET secret пуст — вебхук MAX был бы открыт для поддельных апдейтов."
              echo "Задайте секрет MAX_BOT_WEBHOOK_SECRET (5-256 символов [A-Za-z0-9_-]) в GitHub Actions и повторите деплой."
              exit 1
            fi

            echo "=== Stop old containers ==="
            docker compose --profile max-bot down --remove-orphans || true

            echo "=== Build & start all services ==="
            docker compose --profile max-bot up --build -d --force-recreate

            echo "=== Issue Let's Encrypt certificate if needed ==="
            if ! docker exec collegelms-certbot test -f /etc/letsencrypt/.stvcc-tech-issued; then
              if [ -z "${CERTBOT_EMAIL}" ]; then
                echo "CERTBOT_EMAIL secret is required for the first certificate issuance."
                exit 1
              fi
              docker compose run --rm --entrypoint certbot certbot certonly \
                --webroot \
                --webroot-path /var/www/certbot \
                --email "${CERTBOT_EMAIL}" \
                --agree-tos \
                --no-eff-email \
                --non-interactive \
                --force-renewal \
                -d stvcc.tech
              docker exec collegelms-certbot touch /etc/letsencrypt/.stvcc-tech-issued
              docker compose restart loadbalancer
            fi

            echo "=== Health check (retry up to 60s) ==="
            API_HEALTH="000"
            for i in $(seq 1 12); do
              sleep 5
              API_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5026/healthz || echo "000")
              if [ "$API_HEALTH" = "200" ]; then
                echo "API health check PASSED (attempt $i)"
                break
              fi
              echo "API health check attempt $i: HTTP $API_HEALTH"
            done
            if [ "$API_HEALTH" != "200" ]; then
              echo "API health check FAILED after 12 attempts. Starting rollback..."
              git reset --hard "$PREVIOUS_COMMIT"
              docker compose --profile max-bot up --build -d --force-recreate
              echo "Rollback complete."
              exit 1
            fi

            echo "=== MaxBot verification ==="
            sleep 20
            MAXBOT_ID=$(docker ps -q -f name=collegelms-maxbot -f status=running)
            echo "MaxBot container id: ${MAXBOT_ID:-missing}"
            if [ -z "$MAXBOT_ID" ]; then
              echo "MaxBot is not running. Logs:"
              docker compose logs maxbot --tail 150 || true
              exit 1
            fi
            echo "--- MaxBot logs (tail 120) ---"
            docker compose logs maxbot --tail 120 2>&1 || true
            echo "--- end MaxBot logs ---"
            if docker compose logs --since 60s maxbot 2>&1 | grep -qE "polling loop started|Max bot started as|Webhook-подписка активна"; then
              echo "MaxBot startup detected: OK"
            else
              echo "Warning: MaxBot startup logs not found in last 60s"
            fi

            echo "=== Webhook endpoint check ==="
            WEBHOOK_CODE=000
            for i in 1 2 3 4 5; do
              WEBHOOK_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 15 -X POST https://localhost/maxbot/webhook -H "Content-Type: application/json" -d '{}' 2>/dev/null || true)
              if [ "$WEBHOOK_CODE" = "200" ] || [ "$WEBHOOK_CODE" = "400" ] || [ "$WEBHOOK_CODE" = "401" ]; then
                break
              fi
              echo "Webhook endpoint attempt ${i}/5 -> HTTP ${WEBHOOK_CODE}, retrying in 5s..."
              sleep 5
            done
            echo "POST /maxbot/webhook -> HTTP ${WEBHOOK_CODE}"
            case "$WEBHOOK_CODE" in
              200|400|401)
                echo "Webhook endpoint reachable: OK"
                ;;
              *)
                echo "Webhook endpoint check FAILED (HTTP ${WEBHOOK_CODE})"
                exit 1
                ;;
            esac

            echo "=== Final cleanup ==="
            docker image prune -af || true
