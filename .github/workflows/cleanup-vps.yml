name: Cleanup VPS Disk Only

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Aggressive Docker cleanup on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e

            echo "=== Disk before cleanup ==="
            df -h /

            echo "=== Stop all containers ==="
            cd /home/user1/CollegeLMS
            docker compose --profile telegram-bot down --remove-orphans || true

            echo "=== Remove ALL unused images ==="
            docker image prune -af || true

            echo "=== Remove unused volumes ==="
            docker volume prune -f || true

            echo "=== Remove unused networks ==="
            docker network prune -f || true

            echo "=== Disk after cleanup ==="
            df -h /
