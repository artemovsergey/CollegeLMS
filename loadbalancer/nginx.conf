events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    # CollegeLMS сайт + API
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name stvcc.tech _;
        client_max_body_size 100M;

        ssl_certificate /etc/letsencrypt/live/stvcc.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stvcc.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MAX mini-app: запросы к API через префикс /max/api/ (ссылки из бота)
        location /max/api/ {
            rewrite ^/max/api/(.*)$ /api/$1 break;
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Вебхук бота MAX: https://stvcc.tech/maxbot/webhook
        # proxy_pass через переменную — nginx стартует даже без контейнера maxbot (profile max-bot)
        location /maxbot/ {
            set $maxbot_upstream http://maxbot:8080;
            proxy_pass $maxbot_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /swagger/ {
            proxy_pass http://api:8080/swagger/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://collegelms-next:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
