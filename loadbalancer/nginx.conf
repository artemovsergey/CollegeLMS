events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    # Проброс WebSocket для bb: Connection: upgrade только если клиент его просил
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # CollegeLMS сайт + API
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name stvcc.tech _;
        client_max_body_size 100M;

        ssl_certificate /etc/letsencrypt/live/stvcc.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stvcc.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MAX mini-app: запросы к API через префикс /max/api/ (ссылки из бота)
        location /max/api/ {
            rewrite ^/max/api/(.*)$ /api/$1 break;
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Вебхук бота MAX: https://stvcc.tech/maxbot/webhook
        # proxy_pass через переменную — nginx стартует даже без контейнера maxbot (profile max-bot)
        location /maxbot/ {
            set $maxbot_upstream http://maxbot:8080;
            proxy_pass $maxbot_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /swagger/ {
            proxy_pass http://api:8080/swagger/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://collegelms-next:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # bb (getbb.app): HTTP только для ACME-челленджа и редиректа на HTTPS
    server {
        listen 80;
        server_name bb.stvcc.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://bb.stvcc.tech$request_uri;
        }
    }

    # bb (getbb.app) — удалённый доступ к агенту. Публичный API bb неаутентифицирован
    # и умеет выполнять команды, поэтому vhost закрыт basic auth.
    server {
        listen 443 ssl;
        http2 on;
        server_name bb.stvcc.tech;
        client_max_body_size 100M;

        ssl_certificate /etc/letsencrypt/live/stvcc.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stvcc.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Продление сертификата не должно требовать пароль
        location /.well-known/acme-challenge/ {
            auth_basic off;
            root /var/www/certbot;
        }

        location / {
            auth_basic "bb";
            auth_basic_user_file /etc/nginx/.htpasswd-bb;

            # bb-app слушает 0.0.0.0:38886 на хосте, наружу не публикуется;
            # доступ разрешён только из docker-сети (ufw allow from 172.18.0.0/16).
            # proxy_pass через переменную — nginx стартует, даже если имя хоста
            # ещё не резолвится (extra_hosts появится при пересоздании контейнера)
            set $bb_upstream http://host.docker.internal:38886;
            proxy_pass $bb_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
